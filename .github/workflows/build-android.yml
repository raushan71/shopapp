name: Build Android Release APKs and App Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build signed Android release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      FLUTTER_VERSION: "3.35.5"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Require release signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          missing_secrets=0
          for signing_secret in KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD KEYSTORE_PASSWORD; do
            if [[ -z "${!signing_secret}" ]]; then
              echo "::error::Missing repository secret: $signing_secret. Add it under Settings > Secrets and variables > Actions."
              missing_secrets=1
            fi
          done
          if [[ "$missing_secrets" -ne 0 ]]; then
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Restore generated Android wrapper files
        run: flutter create --platforms=android --project-name itrsp_shop --no-pub .

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
          {
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=release-keystore.jks\n'
          } > android/key.properties

      - name: Build signed release APKs for each architecture
        run: flutter build apk --release --split-per-abi

      - name: Build signed release App Bundle for Google Play
        run: flutter build appbundle --release

      - name: Collect release files and checksums
        run: |
          set -euo pipefail
          for abi in armeabi-v7a arm64-v8a x86_64; do
            mkdir -p "dist/$abi"
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/$abi/"
            (
              cd "dist/$abi"
              sha256sum *.apk > SHA256SUMS.txt
            )
          done
          mkdir -p dist/bundle
          cp build/app/outputs/bundle/release/app-release.aab dist/bundle/
          (
            cd dist/bundle
            sha256sum *.aab > SHA256SUMS.txt
          )

      - name: Upload ARM64 release APK
        uses: actions/upload-artifact@v4
        with:
          name: itrsp_shop-android-arm64-v8a-release-${{ github.run_number }}
          path: dist/arm64-v8a/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload ARM32 release APK
        uses: actions/upload-artifact@v4
        with:
          name: itrsp_shop-android-armeabi-v7a-release-${{ github.run_number }}
          path: dist/armeabi-v7a/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload x86_64 release APK
        uses: actions/upload-artifact@v4
        with:
          name: itrsp_shop-android-x86_64-release-${{ github.run_number }}
          path: dist/x86_64/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload release App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: itrsp_shop-android-appbundle-release-${{ github.run_number }}
          path: dist/bundle/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Add build summary
        run: |
          {
            echo "### Android build: signed release"
            echo ""
            echo "Download the artifact for your device from this run's Artifacts section:"
            echo "- arm64-v8a: 64-bit ARM Android phones."
            echo "- armeabi-v7a: 32-bit ARM Android phones."
            echo "- x86_64: x86-64 Android devices and emulators."
            echo "- appbundle: AAB for Google Play upload."
            echo ""
            echo "Each artifact includes its own SHA256SUMS.txt."
            echo ""
            echo "### Release file sizes"
            echo '```text'
            du -h dist/*/*.apk dist/*/*.aab
            echo '```'
            echo ""
            echo "Shop API: https://shop.itrsp.com/api"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing files
        if: always()
        run: rm -f -- android/key.properties android/app/release-keystore.jks
